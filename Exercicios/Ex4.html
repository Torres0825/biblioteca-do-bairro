
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F8F6F2;
        }

        header, footer {
            padding: 2.5rem 3rem;
            background-color: #E5DED3;
            text-align: center;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        section {
            padding: 2rem 0;
        }

        .cartao {
            padding: 2rem;
            border: 1px solid #E5DED3;
            border-radius: 10px;
            background-color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Olá Mundo</h1>
    </header>

    <main>
        <section>
            <div class="cartao">
                <h2>Tudo bem?</h2>
                <h3>Boas-vindas!</h3>
            </div>
        </section>
    </main>

</body>
</html>
