
<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="stylesheet" href="tema.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
        }

        .biblioteca {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1, h2 {
            color: #263849;
        }

        li {
            padding: 12px;
            margin-bottom: 10px;
            background: #f1f3f5;
            border-radius: 8px;
        }

        .disponivel {
            color: green;
            font-weight: bold;
        }

        .indisponivel {
            color: red;
            font-weight: bold;
        }

        button {
            padding: 7px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #263849;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .informacoes {
            background: #eaf2f8;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        input {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 60%;
        }

        .filtros {
            margin: 15px 0;
        }



        body.escuro {
            background-color: #181818;
            color: white;
        }

        body.escuro .biblioteca {
            background-color: #292929;
        }

        body.escuro h1,
        body.escuro h2 {
            color: white;
        }

        body.escuro li {
            background-color: #383838;
        }

        body.escuro .informacoes {
            background-color: #383838;
        }

        body.escuro input {
            background-color: #383838;
            color: white;
            border: 1px solid #666;
        }
    </style>
</head>

<body>

    <div class="biblioteca">

        <h1>Biblioteca</h1>


        <button id="botao-tema" type="button">
            Alternar tema
        </button>

        <h2>Catálogo de livros</h2>


        <div class="filtros">

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar livro pelo título..."
            >

            <button id="botao-filtro" type="button">
                Mostrar apenas disponíveis
            </button>

        </div>


        <ul id="lista-livros"></ul>

        <div class="informacoes">

            <h2>Resumo da biblioteca</h2>

            <p id="resumo"></p>

            <p id="livro-antigo"></p>

        </div>

        <p id="mensagem"></p>

    </div>


    <script src="app.js"></script>

</body>
</html>
